  <style>
    /* Warna utama dari tema */

      cursor: pointer;
    }
    nav a.home {

      border: 2px dashed #9cc9f3;
      box-shadow: none;
    }
    nav a.design {

      box-shadow: none;
    }
    nav a.product {

      border: 2px dashed #cb86dcff;
      box-shadow: none;
    }
    nav a:hover {

    }
    /* Header */

      padding: 10px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

      font-size: 1.75rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #d481a6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .title .flower {
      font-size: 1.5rem;
      color: #fff4ae;
      filter: drop-shadow(1px 1px 1px #d481a6);
    }

    }
    /* Content */
    .content {
      display: flex;
      gap: 10px;
    }
    .about-section {
      flex: 2;
      border: 2px solid var(--blue);
      border-radius: 20px;
      padding: 15px;
      background: #fff;
      font-size: 0.95rem;
      color: #5a7fa5;
      line-height: 1.4;
    }
    .about-section h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--pink);
      font-weight: 700;
    }
    .about-section em {
      color: var(--pink);
      font-weight: 600;
    }
    .highlight {
      background: var(--orange);
      padding: 2px 5px;
      border-radius: 5px;
      color: #714d26;
      font-weight: 600;
    }
    /* Buttons section */
    .buttons-section {
      flex: 1;
      background: var(--light-blue);
      border: 3px solid var(--blue);
      border-radius: 15px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .buttons-section button {
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 20px;
      padding: 10px 0;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.7);
      transition: filter 0.3s ease;
    }
    .btn-pink {
      background-color: var(--pink);
    }
    .btn-orange {
      background-color: var(--orange);
    }
    .btn-green {
      background-color: var(--green);
    }
    .btn-blue {
      background-color: var(--blue);
    }
    .buttons-section button:hover {
      filter: brightness(80%);
    }
    /* Hearts background in header */
    .header::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 120px;
      top: 75px;
      left: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 5px at 20% 50%, #f5a6bb 99%, transparent 100%),
        radial-gradient(circle 5px at 30% 50%, #a4dff5 99%, transparent 100%),
        radial-gradient(circle 5px at 40% 50%, #f5a6bb 99%, transparent 100%);
      opacity: 0.15;
      z-index: -1;
    }
  </style>

  <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        /* CSS: Membuat tampilan di tengah dan tidak melebar */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        .game-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px; /* Lebar tetap agar tidak melebar */
        }

        h1 { margin-top: 0; color: #333; }

        .status {
            margin-bottom: 15px;
            font-weight: bold;
            color: #555;
            min-height: 24px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 20px;
            /* Grid tidak bisa diklik jika game selesai */
            pointer-events: none; 
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .board.active {
            pointer-events: auto;
            opacity: 1;
        }

        .cell {
            height: 80px;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            color: #333;
        }

        .cell:hover { background-color: #e0e0e0; }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Tekan Mulai untuk bermain</div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button onclick="startGame()">Mulai Game</button>
    </div>

    <script>
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = false;
        let currentPlayer = "X"; // X adalah manusia
        
        const statusDisplay = document.getElementById('status');
        const boardElement = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');

        // Kombinasi menang (baris, kolom, diagonal)
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Baris
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Kolom
            [0, 4, 8], [2, 4, 6]             // Diagonal
        ];

        function startGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            statusDisplay.textContent = "Giliran Anda (X)";
            boardElement.classList.add('active');
            
            // Reset tampilan cell
            cells.forEach(cell => {
                cell.textContent = "";
                cell.style.color = "#333";
            });
        }

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (boardState[clickedCellIndex] !== "" || !isGameActive || currentPlayer !== "X") {
                return;
            }

            // Langkah Manusia
            updateCell(clickedCell, clickedCellIndex, "X");
            checkResult();
        }

        function updateCell(cell, index, player) {
            boardState[index] = player;
            cell.textContent = player;
            if(player === 'X') cell.style.color = "#007bff"; // Biru untuk X
            if(player === 'O') cell.style.color = "#dc3545"; // Merah untuk O
        }

        function computerMove() {
            // Sederhana:_computer memilih angka acak dari cell kosong
            let availableIndexes = boardState
                .map((val, idx) => val === "" ? idx : null)
                .filter(val => val !== null);

            if (availableIndexes.length === 0 || !isGameActive) return;

            const randomIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
            const cell = document.querySelector(`.cell[data-index='${randomIndex}']`);
            
            updateCell(cell, randomIndex, "O");
            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            // Cek apakah ada yang menang
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (boardState[a] === "" || boardState[b] === "" || boardState[c] === "") continue;
                if (boardState[a] === boardState[b] && boardState[b] === boardState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                if(currentPlayer === "X") {
                    statusDisplay.textContent = "SELAMAT! Anda MENANG!";
                    statusDisplay.style.color = "green";
                } else {
                    statusDisplay.textContent = "ANDA KALAH! Computer Menang.";
                    statusDisplay.style.color = "red";
                }
                boardElement.classList.remove('active');
                return;
            }

            // Cek Seri (Draw)
            if (!boardState.includes("")) {
                statusDisplay.textContent = "HASIL SERI!";
                isGameActive = false;
                boardElement.classList.remove('active');
                return;
            }

            // Ganti Giliran
            if (currentPlayer === "X") {
                currentPlayer = "O";
                statusDisplay.textContent = "Computer berpikir...";
                // Jeda sebentar agar seperti berpikir
                setTimeout(computerMove, 500); 
            } else {
                currentPlayer = "X";
                statusDisplay.textContent = "Giliran Anda (X)";
            }
        }

        // Pasang event listener ke semua cell
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    </script>
</body>
</html>
  
</body>
