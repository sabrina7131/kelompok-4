<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shancha’s Project</title>
  <style>
    /* Warna utama dari tema */
    :root {
      --blue: #c2e6ffff;
      --pink: #ffcedfff;
      --orange: #f9cfffff;
      --green: #a7cf7e;
      --light-blue: #b9dcfb;
      --background-gradient: linear-gradient(135deg, #c3e0fc 0%, #fcd7e6 50%, #f0d6f6ff 100%);
      --border-color: #f6c4c9;
      --font-family: 'Verdana';
    }
    /* Reset dan dasar */
    body {
      margin: 0;
      padding: 20px;
      background: var(--background-gradient);
      font-family: var(--font-family);
      color: #555;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background: #fffbf3ff;
      border: 5px dotted var(--border-color);
      border-radius: 20px;
      width: 900px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 15px;
    }
    /* Navbar */
    nav {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
    }
    nav a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 15px;
      font-weight: bold;
      color: white;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      box-shadow: 0 1px 3px rgba(255,255,255,0.7) inset;
      cursor: pointer;
    }
    nav a.home {
      background: var(--blue);
      border: 2px dashed #9cc9f3;
      box-shadow: none;
    }
    nav a.design {
      background: var(--pink);
      border: 2px dashed #f395b9;
      box-shadow: none;
    }
    nav a.product {
      background: var(--orange);
      border: 2px dashed #cb86dcff;
      box-shadow: none;
    }
    nav a:hover {
      filter: brightness(90%);
    }
    /* Header */
    .header {
      background: var(--pink);
      padding: 10px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    .header .title {
      font-size: 1.75rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #d481a6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .title .flower {
      font-size: 1.5rem;
      color: #fff4ae;
      filter: drop-shadow(1px 1px 1px #d481a6);
    }

    }
    /* Content */
    .content {
      display: flex;
      gap: 10px;
    }
    .about-section {
      flex: 2;
      border: 2px solid var(--blue);
      border-radius: 20px;
      padding: 15px;
      background: #fff;
      font-size: 0.95rem;
      color: #5a7fa5;
      line-height: 1.4;
    }
    .about-section h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--pink);
      font-weight: 700;
    }
    .about-section em {
      color: var(--pink);
      font-weight: 600;
    }
    .highlight {
      background: var(--orange);
      padding: 2px 5px;
      border-radius: 5px;
      color: #714d26;
      font-weight: 600;
    }
    /* Buttons section */
    .buttons-section {
      flex: 1;
      background: var(--light-blue);
      border: 3px solid var(--blue);
      border-radius: 15px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .buttons-section button {
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 20px;
      padding: 10px 0;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.7);
      transition: filter 0.3s ease;
    }
    .btn-pink {
      background-color: var(--pink);
    }
    .btn-orange {
      background-color: var(--orange);
    }
    .btn-green {
      background-color: var(--green);
    }
    .btn-blue {
      background-color: var(--blue);
    }
    .buttons-section button:hover {
      filter: brightness(80%);
    }
    /* Hearts background in header */
    .header::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 120px;
      top: 75px;
      left: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 5px at 20% 50%, #f5a6bb 99%, transparent 100%),
        radial-gradient(circle 5px at 30% 50%, #a4dff5 99%, transparent 100%),
        radial-gradient(circle 5px at 40% 50%, #f5a6bb 99%, transparent 100%);
      opacity: 0.15;
      z-index: -1;
    }
  </style>
</head>

        <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tic Tac Toe Pink</title>
    <style>
        /* 1. Layout Utama (Center & Background) */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            /* Warna background pink非常 muda */
            background-color: #fce4ec; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Tinggi penuh layar */
        }

        /* 2. Kotak Game Utama */
        .game-container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 20px;
            /* Bayangan pink agar terlihat jelas */
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.2);
            width: 320px; /* Lebar tetap agar tidak melebar */
            text-align: center;
        }

        /* 3. Judul & Status */
        h1 {
            color: #e91e63; /* Pink tua */
            margin-top: 0;
            font-size: 1.8rem;
        }

        .status {
            color: #880e4f;
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 24px;
        }

        /* 4. Papan Kotak (Grid) */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            /* Kotak Sel */
            height: 80px;
            background-color: #f8bbd0; /* Pink muda */
            border-radius: 12px;
            border: none;
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
        }

        .cell:hover {
            background-color: #f06292; /* Pink hover */
        }

        /* Warna spesifik untuk X dan O */
        .cell.x { background-color: #ec407a; }
        .cell.o { background-color: #d81b60; }

        /* 5. Tombol Reset/Start */
        .btn-restart {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        
        <!-- Status Miseum (Giliran, Menang, Kalah) -->
        <div id="status" class="status">Siap? Main (X)</div>

        <!-- Papan 3x3 -->
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <!-- Tombol Mulai / Ulang -->
        <button class="btn-restart" id="restartBtn">MULAI GAME</button>
    </div>

    <script>
        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');
        const restartBtn = document.getElementById('restartBtn');

        let gameActive = false;
        let currentPlayer = "X";
        let gameState = ["", "", "", "", "", "", "", "", ""];

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Baris
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Kolom
            [0, 4, 8], [2, 4, 6]             // Diagonal
        ];

        // Pesan Status
        const winningMessage = () => `Pemain ${currentPlayer} MENANG!`;
        const drawMessage = () => `Hasilnya SERI!`;
        const currentPlayerTurn = () => `Giliran: ${currentPlayer}`;

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            
            // Tambahkan class untuk warna berbeda X dan O
            clickedCell.classList.add(currentPlayer.toLowerCase());
        }

        function handlePlayerChange() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.textContent = currentPlayerTurn();
        }

        function handleResultValidation() {
            let roundWon = false;
            for (let i = 0; i <= 7; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];
                if (a === '' || b === '' || c === '') {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.textContent = winningMessage();
                gameActive = false;
                return;
            }

            let roundDraw = !gameState.includes("");
            if (roundDraw) {
                statusDisplay.textContent = drawMessage();
                gameActive = false;
                return;
            }

            handlePlayerChange();
        }

        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedCellIndex] !== "" || !gameActive) {
                return;
            }

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleRestartGame() {
            gameActive = true;
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            statusDisplay.textContent = "Siap? Main (X)";
            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove('x', 'o');
            });
        }

        // Event Listeners
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', handleRestartGame);

        // Mulai game otomatis saat pertama kali dibuka
        handleRestartGame();
    </script>
</body>
