  <style>
    /* Warna utama dari tema */
    :root {
      --blue: #c2e6ffff;
      --pink: #ffcedfff;
      --orange: #f9cfffff;
      --green: #a7cf7e;
      --light-blue: #b9dcfb;

    nav a.home {

      border: 2px dashed #9cc9f3;
      box-shadow: none;
    }
    nav a.design {
      background: var(--pink);
      border: 2px dashed #f395b9;
      box-shadow: none;
    }
    nav a.product {
      background: var(--orange);
      border: 2px dashed #cb86dcff;
      box-shadow: none;
    }
    nav a:hover {
      filter: brightness(90%);
    }
    /* Header */
    .header {
      background: var(--pink);
      padding: 10px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    .header .title {
      font-size: 1.75rem;
      font-weight: bold;
      color: #fff;

      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .title .flower {
      font-size: 1.5rem;
      color: #fff4ae;
      filter: drop-shadow(1px 1px 1px #d481a6);
    }

    }
    /* Content */
    .content {
      display: flex;
      gap: 10px;
    }
    .about-section {
      flex: 2;
      border: 2px solid var(--blue);
      border-radius: 20px;
      padding: 15px;
      background: #fff;
      font-size: 0.95rem;
      color: #5a7fa5;
      line-height: 1.4;
    }
    .about-section h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--pink);
      font-weight: 700;
    }
    .about-section em {
      color: var(--pink);
      font-weight: 600;
    }
    .highlight {
      background: var(--orange);
      padding: 2px 5px;
      border-radius: 5px;
      color: #714d26;
      font-weight: 600;
    }
    /* Buttons section */
    .buttons-section {
      flex: 1;
      background: var(--light-blue);
      border: 3px solid var(--blue);
      border-radius: 15px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .buttons-section button {
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 20px;
      padding: 10px 0;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.7);
      transition: filter 0.3s ease;
    }
    .btn-pink {
      background-color: var(--pink);
    }
    .btn-orange {
      background-color: var(--orange);
    }
    .btn-green {
      background-color: var(--green);
    }
    .btn-blue {
      background-color: var(--blue);
    }
    .buttons-section button:hover {
      filter: brightness(80%);
    }
    /* Hearts background in header */
    .header::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 120px;
      top: 75px;
      left: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 5px at 20% 50%, #f5a6bb 99%, transparent 100%),
        radial-gradient(circle 5px at 30% 50%, #a4dff5 99%, transparent 100%),
        radial-gradient(circle 5px at 40% 50%, #f5a6bb 99%, transparent 100%);
      opacity: 0.15;
      z-index: -1;
    }
  </style>

        <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Tic Tac Toe</title>
<style>
    /* Gaya Tampilan (CSS) */
    body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
    }
    h1 { margin-bottom: 10px; }
    #status {
        margin-bottom: 15px;
        font-size: 1.2rem;
        font-weight: bold;
        color: #333;
    }
    .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        gap: 5px;
    }
    .cell {
        width: 100px;
        height: 100px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid #ccc;
    }
    .cell:hover { background: #eef; }
    #restart {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
    }
    #restart:hover { background: #0056b3; }
</style>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    <div id="status">Giliran: X</div>
    
    <div class="board" id="board">
        <!-- Kotak 9 Sel akan dihasilkan di sini oleh JavaScript -->
    </div>

    <button id="restart" onclick="restartGame()">Mulai Ulang</button>

<script>
    /* Logika Game (JavaScript) */
    const board = document.getElementById('board');
    const statusEl = document.getElementById('status');
    let currentPlayer = 'X';
    let gameActive = true;
    let gameState = ["", "", "", "", "", "", "", "", ""];

    const winningConditions = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontal
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertikal
        [0, 4, 8], [2, 4, 6]             // Diagonal
    ];

    // Membuat kotak 3x3 saat halaman dimuat
    function createBoard() {
        board.innerHTML = "";
        gameState.forEach((cell, index) => {
            const cellElement = document.createElement('div');
            cellElement.classList.add('cell');
            cellElement.setAttribute('data-index', index);
            cellElement.addEventListener('click', handleCellClick);
            board.appendChild(cellElement);
        });
    }

    function handleCellClick(e) {
        const clickedCell = e.target;
        const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

        if (gameState[clickedCellIndex] !== "" || !gameActive) {
            return;
        }

        handleCellPlayed(clickedCell, clickedCellIndex);
        handleResultValidation();
    }

    function handleCellPlayed(clickedCell, clickedCellIndex) {
        gameState[clickedCellIndex] = currentPlayer;
        clickedCell.innerHTML = currentPlayer;
    }

    function handleResultValidation() {
        let roundWon = false;
        for (let i = 0; i < winningConditions.length; i++) {
            const winCondition = winningConditions[i];
            let a = gameState[winCondition[0]];
            let b = gameState[winCondition[1]];
            let c = gameState[winCondition[2]];

            if (a === '' || b === '' || c === '') continue;
            if (a === b && b === c) {
                roundWon = true;
                break;
            }
        }

        if (roundWon) {
            statusEl.innerHTML = `Selamat! Pemain ${currentPlayer} MENANG!`;
            gameActive = false;
            return;
        }

        let roundDraw = !gameState.includes("");
        if (roundDraw) {
            statusEl.innerHTML = "Hasilnya SERI (Draw)!";
            gameActive = false;
            return;
        }

        handlePlayerChange();
    }

    function handlePlayerChange() {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusEl.innerHTML = `Giliran: ${currentPlayer}`;
    }

    function restartGame() {
        gameActive = true;
        currentPlayer = "X";
        gameState = ["", "", "", "", "", "", "", "", ""];
        statusEl.innerHTML = `Giliran: X`;
        createBoard(); // Reset visual
    }

    // Jalankan saat pertama kali dibuka
    createBoard();
</script>

</body>
</html>
